spring:
  application:
    name: cs-notes-api
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:}
    retry:
      max-attempts: ${RAG_OPENAI_MAX_ATTEMPTS:3}
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s

server:
  port: 8080

cs-notes:
  documents:
    root: ${CS_NOTES_ROOT:${user.dir}}
    refresh-interval-ms: ${CS_NOTES_REFRESH_INTERVAL_MS:2000}

rag:
  persistence:
    enabled: ${RAG_PERSISTENCE_ENABLED:false}
    url: ${RAG_DATABASE_URL:jdbc:postgresql://localhost:5432/cs_notes}
    username: ${RAG_DATABASE_USERNAME:cs_notes}
    password: ${RAG_DATABASE_PASSWORD:cs_notes}
  embedding:
    model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${RAG_EMBEDDING_DIMENSIONS:1536}
    batch-size: ${RAG_EMBEDDING_BATCH_SIZE:64}
  indexing:
    enabled: ${RAG_INDEXING_ENABLED:false}
    chunk-max-characters: ${RAG_CHUNK_MAX_CHARACTERS:2000}
    max-documents: ${RAG_INDEXING_MAX_DOCUMENTS:200}
    max-chunks-per-document: ${RAG_INDEXING_MAX_CHUNKS_PER_DOCUMENT:200}
    max-characters-per-run: ${RAG_INDEXING_MAX_CHARACTERS_PER_RUN:500000}
  search:
    enabled: ${RAG_SEARCH_ENABLED:false}
    default-limit: ${RAG_SEARCH_DEFAULT_LIMIT:5}
    max-limit: ${RAG_SEARCH_MAX_LIMIT:20}
    max-query-characters: ${RAG_SEARCH_MAX_QUERY_CHARACTERS:500}
    default-minimum-score: ${RAG_SEARCH_DEFAULT_MINIMUM_SCORE:0.5}
    sparse-default-minimum-score: ${RAG_SEARCH_SPARSE_DEFAULT_MINIMUM_SCORE:0.0}
    hybrid-candidate-limit: ${RAG_SEARCH_HYBRID_CANDIDATE_LIMIT:20}
    hybrid-rrf-k: ${RAG_SEARCH_HYBRID_RRF_K:60}
    query-cache-ttl: ${RAG_SEARCH_QUERY_CACHE_TTL:10m}
    query-cache-max-entries: ${RAG_SEARCH_QUERY_CACHE_MAX_ENTRIES:100}
  answer:
    enabled: ${RAG_ANSWER_ENABLED:false}
    model: ${RAG_ANSWER_MODEL:gpt-4.1-mini}
    max-output-tokens: ${RAG_ANSWER_MAX_OUTPUT_TOKENS:600}
    temperature: ${RAG_ANSWER_TEMPERATURE:0.2}
    default-source-limit: ${RAG_ANSWER_DEFAULT_SOURCE_LIMIT:4}
    max-source-limit: ${RAG_ANSWER_MAX_SOURCE_LIMIT:6}
    max-context-characters: ${RAG_ANSWER_MAX_CONTEXT_CHARACTERS:12000}
    default-minimum-score: ${RAG_ANSWER_DEFAULT_MINIMUM_SCORE:0.3}
    cache-ttl: ${RAG_ANSWER_CACHE_TTL:10m}
    cache-max-entries: ${RAG_ANSWER_CACHE_MAX_ENTRIES:100}
    input-price-per-million-usd: ${RAG_ANSWER_INPUT_PRICE_PER_MILLION_USD:0.40}
    output-price-per-million-usd: ${RAG_ANSWER_OUTPUT_PRICE_PER_MILLION_USD:1.60}
    daily-cost-limit-usd: ${RAG_ANSWER_DAILY_COST_LIMIT_USD:0.25}
    budget-zone-id: ${RAG_ANSWER_BUDGET_ZONE_ID:Asia/Seoul}
